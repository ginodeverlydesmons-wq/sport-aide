<style>

*{box-sizing:border-box}

a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.demo{background:var(--ink);color:var(--paper);padding:.5rem 1rem;font-size:.9rem}

.sub{color:var(--mut);max-width:34ch;margin:1rem 0}
.search{position:relative;max-width:420px}

#sug{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;z-index:5;overflow:hidden}

.mapbox{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.tog{display:flex}
.tog button{border-radius:0;border-color:var(--ink)}
.tog button:first-child{border-radius:6px 0 0 6px}
.tog button:last-child{border-radius:0 6px 6px 0;border-left:0}
.tog button.on{background:var(--ink);color:var(--paper)}
svg{width:min(300px,78vw);height:auto}
.b{fill:var(--body);stroke:var(--line)}
.z{fill:var(--zone);stroke:var(--paper);stroke-width:1.5;cursor:pointer;transition:fill .15s}

#map.back .F,#map:not(.back) .K{display:none}
#cap{min-height:1.6rem;font-weight:700}
.bk{display:inline-block;margin:.5rem 0 1rem;color:var(--mut)}
h2{font-size:clamp(2rem,5vw,3rem);margin-bottom:.8rem}

.mut{color:var(--mut)}
.list{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:.5rem 1rem;align-items:center;padding:.9rem .3rem;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover{background:var(--card)}
.rn{font-weight:700;font-size:1.1rem}
.rn small{display:block;font-weight:400;color:var(--mut);font-size:.85rem}
.tags{display:flex;gap:.3rem;flex-wrap:wrap}
.tag{font-style:normal;font-size:.8rem;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:.05rem .5rem}
.tag.lv{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.w{color:var(--warn);border-color:var(--warn)}
.tag.c{color:var(--acc);border-color:var(--acc)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}
.chip{border:1px solid var(--ink);border-radius:99px;padding:.15rem .8rem;text-decoration:none;font-size:.9rem}
.chip.primary{background:var(--ink);color:var(--paper)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.vid{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.th{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:0;padding:0;background:#000 center/cover;position:relative}
.th span{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;color:#fff;text-shadow:0 0 12px #000}
.vm{padding:.7rem .8rem}
.vm b{display:block;margin-bottom:.4rem;overflow-wrap:anywhere}
.act{display:flex;align-items:center;gap:.4rem;margin-top:.6rem}
.act button{padding:.2rem .6rem}
.act .rp{margin-left:auto;border:0;background:none;color:var(--mut);font-size:.85rem}

footer{max-width:1020px;margin:2rem auto 1rem;padding:0 1rem;color:var(--mut);font-size:.85rem}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:6px;max-width:90vw;z-index:20}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--ink);border-radius:10px}
dialog::backdrop{background:#12151Caa}
#af{display:grid;gap:.6rem;min-width:min(300px,76vw)}
.btns{display:flex;gap:.5rem}

.fbar{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1rem}
.fbar button{border-radius:99px;padding:.2rem .8rem;font-size:.9rem}

#addx textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.5rem .75rem;min-height:4.5rem}
#addx p{margin:0}
.page{max-width:62ch}
.page p{margin:0 0 1rem}
details{border-bottom:1px solid var(--line);padding:.8rem 0}
summary{cursor:pointer;font-weight:700}

  <section id="faq" class="page" hidden><a class="bk" href="#/" data-i="home"></a><h2>FAQ</h2><div id="faqc"></div></section>
</main>

<footer><p data-i="warn"></p><nav><a href="#/about" data-i="aboutl"></a><a href="#/faq">FAQ</a></nav></footer>

let level = localStorage.level || "", muscles = [], user = null, cur = null, theme = document.documentElement.dataset.theme;
const eqSel = new Set(), xSel = new Set();
let S = (() => { try { return JSON.parse(localStorage.sa) || {}; } catch { return {}; } })();
S.ex = S.ex || []; S.vid = S.vid || {};
const save = () => localStorage.sa = JSON.stringify(S);
const ytId = s => (s.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/) || [])[1];
const curSlug = () => (location.hash.match(/muscle\/(.+)$/) || [])[1];
const localRows = slug => S.ex.filter(e => e.m[slug] && (!level || e.level === level)).map(e => ({id:e.id, name:e.n, level:e.level, eq:e.eq, role:e.m[slug], n:(S.vid[e.id] || []).length, mine:1}));
const t = k => T[lang][k] || T.en[k] || k;
const mn = m => m.names[lang] || m.names.en || m.slug;
const eqs = a => (a || []).map(x => EQ[x] ? EQ[x][lang === "fr" ? 0 : 1] : esc(x));
const toast = s => { const e = $("#toast"); e.textContent = s; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => e.hidden = true, 4500); };

function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-p]").forEach(e => e.placeholder = t(e.dataset.p));
  ["", "beginner", "intermediate", "advanced"].forEach((v, i) => $("#lv").options[i].text = t(v || "all"));
  $("#ab").textContent = user ? t("logout") : t("login");
  $("#aboutc").innerHTML = t("about");
  $("#faqc").innerHTML = t("faq").map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");
  ["beginner", "intermediate", "advanced"].forEach((v, i) => $("#xl").options[i].text = t(v));
  $("#demo").textContent = t("demo"); $("#demo").hidden = !!sb;
  document.querySelectorAll(".z").forEach(z => { const m = muscles.find(x => x.zone === z.dataset.z); if (m) z.setAttribute("aria-label", mn(m)); });
}

// ---------- Données ----------
async function dbMuscles() {
  const { data, error } = await sb.from("muscles").select("slug,side,svg_zone_id,muscle_translations(lang,name)");
  if (error) { toast(error.message); return DM; }
  return data.map(m => ({slug:m.slug, side:m.side, zone:m.svg_zone_id, names:Object.fromEntries(m.muscle_translations.map(x => [x.lang, x.name]))}));
}
async function listEx(slug) {
  if (!sb) return DE.filter(e => e.m[slug] && (!level || e.level === level)).map(e => ({id:e.id, name:e.n[lang] || e.n.en, level:e.level, eq:e.eq, role:e.m[slug], n:0}));
  const { data, error } = await sb.rpc("exercises_by_muscle", {p_muscle_slug:slug, p_lang:lang, p_level:level || null});
  if (error) { toast(error.message); return []; }
  return data.map(r => ({id:r.exercise_id, name:r.exercise_name, level:r.exercise_level, eq:r.equipment, role:r.role_in_exercise, n:r.video_count}));
}
async function getExo(id) {
  if (id[0] === "u") { const e = S.ex.find(x => x.id === id); return e && {id:e.id, level:e.level, eq:e.eq, name:e.n, desc:e.d || "", ms:Object.entries(e.m).map(([s, r]) => ({slug:s, role:r})), mine:1}; }
  if (!sb) { const e = DE.find(x => x.id == id); return e && {id:e.id, level:e.level, eq:e.eq, name:e.n[lang] || e.n.en, desc:e.d[lang] || e.d.en, ms:Object.entries(e.m).map(([s, r]) => ({slug:s, role:r})), v:e.v}; }
  const { data } = await sb.from("exercises").select("id,level,equipment,exercise_translations(lang,name,description),exercise_muscles(role,muscles(slug))").eq("id", id).maybeSingle();
  if (!data) return null;
  const tr = data.exercise_translations.find(x => x.lang === lang) || data.exercise_translations.find(x => x.lang === "en") || data.exercise_translations[0] || {};
  return {id:data.id, level:data.level, eq:data.equipment, name:tr.name || "?", desc:tr.description || "", ms:data.exercise_muscles.map(x => ({slug:x.muscles.slug, role:x.role}))};
}

// ---------- Vues ----------
async function showMuscle(slug) {
  const m = muscles.find(x => x.slug === slug); if (!m) return;
  $("#mt").textContent = mn(m);
  document.querySelectorAll(".z").forEach(z => z.classList.toggle("sel", z.dataset.z === m.zone));
  const rows = (await listEx(slug)).concat(localRows(slug)).filter(r => !eqSel.size || (r.eq || []).some(x => eqSel.has(x)));
  $("#mlist").innerHTML = rows.length ? rows.map(r =>
    `<a class="row" href="#/exo/${esc(r.id)}"><span class="rn">${esc(r.name)}<small>${t(r.role === "primary" ? "prim" : "sec")}</small></span>` +
    `<span class="tags"><i class="tag lv">${t(r.level)}</i>${r.mine ? `<i class="tag c">${t("mine")}</i>` : ""}${eqs(r.eq).map(x => `<i class="tag">${x}</i>`).join("")}</span>` +
    `<span class="mut">${r.n} ${t("vids")}</span></a>`).join("") : `<p class="mut">${t("none")}</p>`;
}
async function showExo(id) {
  if (!/^u?\d+$/.test(id)) return;
  const e = await getExo(id);
  if (!e) { $("#et").textContent = "404"; return; }
  cur = e;
  $("#et").textContent = e.name;
  $("#emeta").innerHTML = `<i class="tag lv">${t(e.level)}</i>` + (e.mine ? `<i class="tag c">${t("mine")}</i>` : "") + eqs(e.eq).map(x => `<i class="tag">${x}</i>`).join("");
  $("#ed").textContent = e.desc;
  $("#chips").innerHTML = e.ms.map(x => { const m = muscles.find(y => y.slug === x.slug); return m ? `<a class="chip ${x.role}" href="#/muscle/${esc(m.slug)}" title="${t(x.role === "primary" ? "prim" : "sec")}">${esc(mn(m))}</a>` : ""; }).join("");
  loadVideos();
}
function vcard(v) {
  const id = /^[\w-]{11}$/.test(v.external_id || "") ? v.external_id : null;
  if (!id) return "";
  const tags = (v.is_reference ? `<i class="tag c">★ ${t("ref")}</i>` : "") + (v.coach_validated ? `<i class="tag c">✓ ${t("coach")}</i>` : "") + (v.status !== "published" ? `<i class="tag w">${t("pend")}</i>` : "");
  return `<div class="vid"><button class="th" data-id="${id}" style="background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)" aria-label="${t("video")}"><span>▶</span></button>` +
    `<div class="vm"><b>${esc(v.title || t("video"))}</b><div class="tags">${tags}</div>` +
    (v.loc ? "" : `<div class="act"><button data-v="${v.id}" data-val="1" aria-label="+1">▲</button><b>${v.score}</b><button data-v="${v.id}" data-val="-1" aria-label="-1">▼</button><button class="rp" data-r="${v.id}">⚑ ${t("rep")}</button></div>`) + "</div></div>";
}
async function loadVideos() {
  const box = $("#vids");
  if (!sb || String(cur.id)[0] === "u") {
    const ids = [...(cur.v || []), ...(S.vid[cur.id] || [])];
    box.innerHTML = ids.length ? ids.map((x, i) => vcard({id:i, external_id:x, loc:1, status:"published"})).join("") : `<p class="mut">${t("noV")}</p>`;
    return;
  }
  const { data, error } = await sb.from("videos").select("id,external_id,title,score,status,is_reference,coach_validated")
    .eq("exercise_id", cur.id).order("is_reference", {ascending:false}).order("coach_validated", {ascending:false}).order("score", {ascending:false});
  if (error) return toast(error.message);
  box.innerHTML = data.length ? data.map(vcard).join("") : `<p class="mut">${t("noV")}</p>`;
}
function route() {
  const [, k, v] = location.hash.match(/^#\/(\w+)(?:\/(.+))?$/) || [];
  $("#home").hidden = !!k; $("#muscle").hidden = k !== "muscle"; $("#exo").hidden = k !== "exo";
  $("#about").hidden = k !== "about"; $("#faq").hidden = k !== "faq";
  if (k === "muscle") showMuscle(v); else if (k === "exo") showExo(v);
  window.scrollTo(0, 0);
}

// ---------- Carte et recherche ----------
function setSide(s) { $("#map").classList.toggle("back", s === "back"); $("#sf").classList.toggle("on", s === "front"); $("#sbk").classList.toggle("on", s === "back"); }
$("#sf").onclick = () => setSide("front");
$("#sbk").onclick = () => setSide("back");
$("#map").addEventListener("click", e => { const z = e.target.closest(".z"), m = z && muscles.find(x => x.zone === z.dataset.z); if (m) location.hash = "#/muscle/" + m.slug; });
$("#map").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("z")) e.target.dispatchEvent(new MouseEvent("click", {bubbles:true})); });
$("#map").addEventListener("mouseover", e => { const z = e.target.closest(".z"), m = z && muscles.find(x => x.zone === z.dataset.z); $("#cap").textContent = m ? mn(m) : ""; });
function go(slug) { const m = muscles.find(x => x.slug === slug); if (!m) return; setSide(m.side); $("#q").value = ""; $("#sug").innerHTML = ""; location.hash = "#/muscle/" + slug; }
$("#q").addEventListener("input", () => {
  const q = norm($("#q").value.trim());
  const r = q ? muscles.filter(m => Object.values(m.names).some(n => norm(n).includes(q))).slice(0, 6) : [];
  $("#sug").innerHTML = r.map(m => `<button data-s="${esc(m.slug)}">${esc(mn(m))}</button>`).join("");
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("#sug button"); if (b) go(b.dataset.s); } });
$("#sug").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.s); });

// ---------- Vidéos : lecture, votes, signalements, ajout ----------
$("#vids").addEventListener("click", async e => {
  const th = e.target.closest(".th");
  if (th) { th.outerHTML = `<iframe class="th" src="https://www.youtube-nocookie.com/embed/${th.dataset.id}?autoplay=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`; return; }
  const b = e.target.closest("button"); if (!b) return;
  if (!sb) return toast(t("demo"));
  if (!user) return openAuth();
  if (b.dataset.v) {
    const { error } = await sb.from("votes").upsert({user_id:user.id, video_id:+b.dataset.v, value:+b.dataset.val}, {onConflict:"user_id,video_id"});
    if (error) toast(error.message); else loadVideos();
  } else if (b.dataset.r) {
    const { error } = await sb.from("reports").insert({video_id:+b.dataset.r, user_id:user.id, reason:"other"});
    toast(error ? (error.code === "23505" ? t("repdup") : error.message) : t("reported"));
  }
});
$("#addf").onsubmit = async e => {
  e.preventDefault();
  const id = ytId($("#vurl").value);
  if (!id) return toast(t("badurl"));
  if (!sb || String(cur.id)[0] === "u") {
    const a = S.vid[cur.id] = S.vid[cur.id] || [];
    if (a.includes(id)) return toast(t("dup"));
    a.push(id); save(); $("#vurl").value = ""; toast(t("okpub")); return loadVideos();
  }
  if (!user) return openAuth();
  let title = null;
  try { const r = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id)); if (r.ok) title = (await r.json()).title; } catch {}
  const { data, error } = await sb.from("videos").insert({exercise_id:cur.id, user_id:user.id, source:"youtube", external_id:id, title, thumbnail_url:"https://i.ytimg.com/vi/" + id + "/hqdefault.jpg", language:lang, level:cur.level}).select("status").single();
  if (error) return toast(error.code === "23505" ? t("dup") : error.message);
  $("#vurl").value = ""; toast(t(data.status === "published" ? "okpub" : "okpend")); loadVideos();
};

// ---------- Compte ----------
function openAuth() { if (!sb) return toast(t("demo")); $("#auth").showModal(); }
async function auth(kind) {
  const email = $("#mail").value, password = $("#pw").value;
  const { data, error } = kind === "up" ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
  if (error) return toast(error.message);
  $("#auth").close(); toast(kind === "up" && !data.session ? t("confirm") : t("hi"));
}
$("#af").onsubmit = e => { e.preventDefault(); auth("in"); };
$("#bup").onclick = () => $("#af").reportValidity() && auth("up");
$("#bx").onclick = () => $("#auth").close();
$("#ab").onclick = () => user ? sb.auth.signOut() : openAuth();

// ---------- Langue, niveau, démarrage ----------
$("#lg").onchange = e => { lang = e.target.value; localStorage.lang = lang; applyI18n(); renderEq(); route(); };
$("#lv").onchange = e => { level = e.target.value; localStorage.level = level; route(); };
addEventListener("hashchange", route);

function renderEq() {
  const mk = (box, set, cb) => {
    box.innerHTML = Object.keys(EQ).map(k => `<button type="button" data-k="${k}" aria-pressed="${set.has(k)}">${EQ[k][lang === "fr" ? 0 : 1]}</button>`).join("");
    box.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; set.has(k) ? set.delete(k) : set.add(k); b.setAttribute("aria-pressed", set.has(k)); if (cb) cb(); };
  };
  mk($("#eqf"), eqSel, () => showMuscle(curSlug()));
  mk($("#xeq"), xSel);
}
$("#addx").onsubmit = e => {
  e.preventDefault();
  const slug = curSlug(); if (!slug) return;
  const ex = {id:"u" + Date.now(), level:$("#xl").value, eq:[...xSel], n:$("#xn").value.trim(), d:$("#xd").value.trim(), m:{[slug]:"primary"}};
  S.ex.push(ex);
  const v = ytId($("#xv").value); if (v) S.vid[ex.id] = [v];
  save(); e.target.reset(); xSel.clear(); renderEq(); showMuscle(slug); toast(t("xok"));
};
const paint = () => $("#th").textContent = theme === "dark" ? "☀" : "☾";
$("#th").onclick = () => { theme = theme === "dark" ? "light" : "dark"; localStorage.theme = theme; document.documentElement.dataset.theme = theme; paint(); };
paint();

(async () => {
  $("#lg").value = lang; $("#lv").value = level;
  muscles = sb ? await dbMuscles() : DM;
  if (sb) {
    const { data } = await sb.auth.getSession(); user = data.session ? data.session.user : null;
    sb.auth.onAuthStateChange((_, s) => { user = s ? s.user : null; applyI18n(); });
  }
  document.querySelectorAll(".z").forEach(z => { z.tabIndex = 0; z.setAttribute("role", "button"); });
  applyI18n(); renderEq(); route();
})();
</script>
</body>
</html>
