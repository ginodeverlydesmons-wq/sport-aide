<style>
:root{--paper:#EEF1F4;--ink:#12151C;--mut:#5B6472;--line:#D3D9E1;--card:#fff;--body:#DCE1E9;--zone:#B4BFD0;--acc:#2338E6;--onacc:#fff;--warn:#9A5B00;color-scheme:light}
:root[data-theme=dark]{--paper:#12151C;--ink:#EEF1F4;--mut:#9AA3B2;--line:#2B313C;--card:#1A1E26;--body:#272D38;--zone:#3B4556;--acc:#8A97FF;--onacc:#12151C;--warn:#F0B050;color-scheme:dark}

body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}

a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
select,input,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.5rem .75rem}
button{cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
.demo{background:var(--ink);color:var(--paper);padding:.5rem 1rem;font-size:.9rem}
header{display:flex;gap:.6rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:1.7rem;font-weight:700;margin-right:auto;text-decoration:none}
main{max-width:1020px;margin:0 auto;padding:1rem}
.hero{display:grid;gap:1.5rem;align-items:center;padding:1rem 0}

.sub{color:var(--mut);max-width:34ch;margin:1rem 0}
.search{position:relative;max-width:420px}
.search input{width:100%;padding:.85rem 1rem;font-size:1.05rem;border-width:2px;border-color:var(--ink)}
#sug{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;z-index:5;overflow:hidden}
#sug button{display:block;width:100%;text-align:left;border:0;border-radius:0}
#sug button:hover,#sug button:focus-visible{background:var(--paper)}
.mapbox{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.tog{display:flex}
.tog button{border-radius:0;border-color:var(--ink)}
.tog button:first-child{border-radius:6px 0 0 6px}
.tog button:last-child{border-radius:0 6px 6px 0;border-left:0}
.tog button.on{background:var(--ink);color:var(--paper)}
svg{width:min(300px,78vw);height:auto}
.b{fill:var(--body);stroke:var(--line)}
.z{fill:var(--zone);stroke:var(--paper);stroke-width:1.5;cursor:pointer;transition:fill .15s}
.z:hover,.z.sel{fill:var(--acc)}
#map.back .F,#map:not(.back) .K{display:none}
#cap{min-height:1.6rem;font-weight:700}
.bk{display:inline-block;margin:.5rem 0 1rem;color:var(--mut)}
h2{font-size:clamp(2rem,5vw,3rem);margin-bottom:.8rem}
h3{font-size:1.4rem;margin:1.6rem 0 .8rem}
.mut{color:var(--mut)}
.list{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:.5rem 1rem;align-items:center;padding:.9rem .3rem;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover{background:var(--card)}
.rn{font-weight:700;font-size:1.1rem}
.rn small{display:block;font-weight:400;color:var(--mut);font-size:.85rem}
.tags{display:flex;gap:.3rem;flex-wrap:wrap}
.tag{font-style:normal;font-size:.8rem;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:.05rem .5rem}
.tag.lv{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.w{color:var(--warn);border-color:var(--warn)}
.tag.c{color:var(--acc);border-color:var(--acc)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}
.chip{border:1px solid var(--ink);border-radius:99px;padding:.15rem .8rem;text-decoration:none;font-size:.9rem}
.chip.primary{background:var(--ink);color:var(--paper)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.vid{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.th{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:0;padding:0;background:#000 center/cover;position:relative}
.th span{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;color:#fff;text-shadow:0 0 12px #000}
.vm{padding:.7rem .8rem}
.vm b{display:block;margin-bottom:.4rem;overflow-wrap:anywhere}
.act{display:flex;align-items:center;gap:.4rem;margin-top:.6rem}
.act button{padding:.2rem .6rem}
.act .rp{margin-left:auto;border:0;background:none;color:var(--mut);font-size:.85rem}
#addf{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid var(--line)}
#addf input{flex:1 1 260px}
footer{max-width:1020px;margin:2rem auto 1rem;padding:0 1rem;color:var(--mut);font-size:.85rem}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:6px;max-width:90vw;z-index:20}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--ink);border-radius:10px}
dialog::backdrop{background:#12151Caa}
#af,#rf{display:grid;gap:.6rem;min-width:min(310px,78vw)}
.btns{display:flex;gap:.5rem}
@media(max-width:560px){.row{grid-template-columns:1fr auto}.tags{grid-column:1/-1}}
.fbar{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1rem}
.fbar button{border-radius:99px;padding:.2rem .8rem;font-size:.9rem}
.fbar button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#addx{margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--line);display:grid;gap:.6rem;max-width:560px}
#addx textarea,#rd{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.5rem .75rem;min-height:4.5rem}
#addx p{margin:0}
.page{max-width:62ch}
.page p{margin:0 0 1rem}
details{border-bottom:1px solid var(--line);padding:.8rem 0}
summary{cursor:pointer;font-weight:700}
details p{margin:.6rem 0 0;color:var(--mut)}
footer nav{display:flex;gap:1rem;margin-top:.6rem}
.tools{display:flex;gap:1.3rem;flex-wrap:wrap;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.tools a{text-decoration:none;color:var(--mut)}
.tools a[aria-current]{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:6px}
.fgrid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));max-width:640px;align-items:end;margin-bottom:1rem}
.fgrid label{display:grid;gap:.2rem}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem;margin:1.2rem 0;max-width:640px}
.macros div{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.8rem}
.macros b{display:block;font:700 1.9rem/1.1 "Bricolage Grotesque",sans-serif}
.macros span{color:var(--mut);font-size:.9rem}
#tm{border:1px solid var(--line);background:var(--card);border-radius:14px;text-align:center;padding:1.5rem;margin:1rem 0;max-width:640px}
#tm[data-k=work]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
#tm[data-k=rest]{background:var(--zone)}
#tp{font-weight:700;font-size:1.2rem}
#tt{font:700 clamp(4rem,18vw,8rem)/1 "Bricolage Grotesque",sans-serif}
#lc svg{width:100%;max-width:620px;height:auto}
#lt{width:100%;max-width:640px;border-collapse:collapse}
#lt td{border-bottom:1px solid var(--line);padding:.5rem .3rem}
#lt button{padding:.1rem .6rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden></div>
<header>
  <a class="logo" href="#/">SportAide</a>
  <select id="lv" aria-label="Niveau"><option value=""></option><option value="beginner"></option><option value="intermediate"></option><option value="advanced"></option></select>
  <select id="lg" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option></select>
  <button id="th" aria-label="Thème"></button>

</header>
<nav class="tools"><a href="#/" data-i="nav_ex"></a><a href="#/timer" data-i="timerl"></a><a href="#/calc" data-i="calcl"></a><a href="#/log" data-i="logl"></a></nav>

<main>
  <section id="home" class="hero">
    <div>
      <h1 data-i="h1"></h1>
      <p class="sub" data-i="sub"></p>

      <div id="cap" aria-live="polite"></div>

  </section>

  <section id="muscle" hidden>
    <a class="bk" href="#/" data-i="home"></a>
    <h2 id="mt"></h2>
    <div id="eqf" class="fbar" role="group" aria-label="Matériel"></div>
    <div id="mlist" class="list"></div>
    <form id="addx">
      <h3 data-i="addx"></h3>
      <input id="xn" required maxlength="80" data-p="xnph">
      <p class="mut" data-i="xeql"></p>
      <div id="xeq" class="fbar" role="group"></div>

      <textarea id="xd" maxlength="400" data-p="xdph"></textarea>

      <button class="pri" data-i="xsend"></button>
      <p class="mut" data-i="xnote"></p>
    </form>
  </section>

  <section id="exo" hidden>
    <a class="bk" href="#/" data-i="home"></a>
    <h2 id="et"></h2>
    <div id="emeta" class="tags"></div>
    <p id="ed"></p>
    <div id="chips" class="chips"></div>
    <h3 data-i="vid"></h3>
    <div id="vids" class="grid"></div>
    <form id="addf"><input id="vurl" data-p="urlph" required><button class="pri" data-i="send"></button></form>
  </section>
  <section id="calc" class="page" hidden><a class="bk" href="#/" data-i="home"></a><h2 data-i="calcl"></h2>
    <form id="cf" class="fgrid">
      <label><span data-i="sex"></span><select id="cs"><option value="m"></option><option value="f"></option></select></label>
      <label><span data-i="age"></span><input id="ca" type="number" min="15" max="90" required></label>
      <label><span data-i="height"></span><input id="ch" type="number" min="120" max="230" required></label>
      <label><span data-i="weight"></span><input id="cw" type="number" min="35" max="250" step="0.1" required></label>
      <label><span data-i="act"></span><select id="cac"><option value="1.2"></option><option value="1.375"></option><option value="1.55"></option><option value="1.725"></option><option value="1.9"></option></select></label>
      <label><span data-i="goal"></span><select id="cg"><option value="bulk"></option><option value="cut"></option><option value="maint"></option></select></label>
      <button class="pri" data-i="calcgo"></button>
    </form>
    <div id="cres" aria-live="polite"></div>
    <p class="mut" data-i="calcnote"></p>
  </section>
  <section id="timer" class="page" hidden><a class="bk" href="#/" data-i="home"></a><h2 data-i="timerl"></h2>
    <div id="tpre" class="fbar"><button type="button" data-w="20" data-r="10" data-n="8">Tabata</button><button type="button" data-w="40" data-r="20" data-n="10">HIIT</button></div>
    <div class="fgrid">
      <label><span data-i="twork"></span><input id="tw" type="number" min="5" max="600" value="20"></label>
      <label><span data-i="trest"></span><input id="tr" type="number" min="0" max="600" value="10"></label>
      <label><span data-i="trounds"></span><input id="tn" type="number" min="1" max="50" value="8"></label>
    </div>
    <div id="tm" data-k="prep" role="timer"><div id="tp"></div><div id="tt">5</div></div>
    <div class="btns"><button id="tgo" class="pri"></button><button id="trs" data-i="treset"></button></div>
  </section>
  <section id="log" class="page" hidden><a class="bk" href="#/" data-i="home"></a><h2 data-i="logl"></h2>
    <form id="lf" class="fgrid">
      <label><span data-i="ldate"></span><input id="ld" type="date" required></label>
      <label><span data-i="lex"></span><input id="le" list="ln" required maxlength="80"><datalist id="ln"></datalist></label>
      <label><span data-i="lsets"></span><input id="lsr" type="number" min="1" max="50" value="3" required></label>
      <label><span data-i="lreps"></span><input id="lr" type="number" min="1" max="500" value="10" required></label>
      <label><span data-i="lkg"></span><input id="lw" type="number" min="0" max="1000" step="0.5" value="0"></label>
      <button class="pri" data-i="ladd"></button>
    </form>
    <p class="mut" data-i="lnote"></p>
    <h3 data-i="lprog"></h3><select id="ls"></select><div id="lc"></div>
    <h3 data-i="lhist"></h3><table id="lt"></table>
  </section>
  <section id="about" class="page" hidden><a class="bk" href="#/" data-i="home"></a><h2 data-i="aboutl"></h2><div id="aboutc"></div></section>
  <section id="faq" class="page" hidden><a class="bk" href="#/" data-i="home"></a><h2>FAQ</h2><div id="faqc"></div></section>
</main>

<footer><p data-i="warn"></p><nav><a href="#/about" data-i="aboutl"></a><a href="#/faq">FAQ</a></nav></footer>
<div id="toast" hidden></div>

    <div class="btns"><button class="pri" data-i="repSend"></button><button type="button" id="rx" aria-label="Fermer">×</button></div>

  </form>
</dialog>

let lang = localStorage.lang || (navigator.language || "").slice(0, 2);
if (!T[lang]) lang = "en";
let level = localStorage.level || "", muscles = [], user = null, cur = null, theme = document.documentElement.dataset.theme;
const eqSel = new Set(), xSel = new Set();

S.ex = S.ex || []; S.vid = S.vid || {}; S.hid = S.hid || []; S.log = S.log || [];

const ytId = s => (s.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/) || [])[1];
const curSlug = () => (location.hash.match(/muscle\/(.+)$/) || [])[1];
const localRows = slug => S.ex.filter(e => e.m[slug] && (!level || e.level === level)).map(e => ({id:e.id, name:e.n, level:e.level, eq:e.eq, role:e.m[slug], n:(S.vid[e.id] || []).length, mine:1}));

function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-p]").forEach(e => e.placeholder = t(e.dataset.p));
  ["", "beginner", "intermediate", "advanced"].forEach((v, i) => $("#lv").options[i].text = t(v || "all"));
  $("#ab").textContent = user ? t("logout") : t("login");
  $("#aboutc").innerHTML = t("about");
  $("#faqc").innerHTML = t("faq").map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");
  ["beginner", "intermediate", "advanced"].forEach((v, i) => $("#xl").options[i].text = t(v));
  const fill = (q, ks) => ks.forEach((k, i) => $(q).options[i].text = t(k));
  fill("#cs", ["male", "female"]); fill("#cac", ["act1", "act2", "act3", "act4", "act5"]); fill("#cg", ["bulk", "cut", "maint"]);
  $("#rr").innerHTML = ["dangerous", "wrong_exercise", "wrong_category", "spam", "inappropriate", "copyright", "broken_link", "other"].map(k => `<option value="${k}">${t("rs_" + k)}</option>`).join("");
  $("#tgo").textContent = t(TM.h ? "tpause" : "tstart");
  $("#demo").textContent = t("demo"); $("#demo").hidden = true;
  document.querySelectorAll(".z").forEach(z => { const m = muscles.find(x => x.zone === z.dataset.z); if (m) z.setAttribute("aria-label", mn(m)); });
}

// ---------- Données ----------
async function dbMuscles() {
  const { data, error } = await sb.from("muscles").select("slug,side,svg_zone_id,muscle_translations(lang,name)");
  if (error) { toast(error.message); return DM; }
  return data.map(m => ({slug:m.slug, side:m.side, zone:m.svg_zone_id, names:Object.fromEntries(m.muscle_translations.map(x => [x.lang, x.name]))}));
}
async function listEx(slug) {
  if (!sb) return DE.filter(e => e.m[slug] && (!level || e.level === level)).map(e => ({id:e.id, name:e.n[lang] || e.n.en, level:e.level, eq:e.eq, role:e.m[slug], n:0}));
  const { data, error } = await sb.rpc("exercises_by_muscle", {p_muscle_slug:slug, p_lang:lang, p_level:level || null});
  if (error) { toast(error.message); return []; }
  return data.map(r => ({id:r.exercise_id, name:r.exercise_name, level:r.exercise_level, eq:r.equipment, role:r.role_in_exercise, n:r.video_count}));
}
async function getExo(id) {
  if (id[0] === "u") { const e = S.ex.find(x => x.id === id); return e && {id:e.id, level:e.level, eq:e.eq, name:e.n, desc:e.d || "", ms:Object.entries(e.m).map(([s, r]) => ({slug:s, role:r})), mine:1}; }
  if (!sb) { const e = DE.find(x => x.id == id); return e && {id:e.id, level:e.level, eq:e.eq, name:e.n[lang] || e.n.en, desc:e.d[lang] || e.d.en, ms:Object.entries(e.m).map(([s, r]) => ({slug:s, role:r})), v:e.v}; }
  const { data } = await sb.from("exercises").select("id,level,equipment,exercise_translations(lang,name,description),exercise_muscles(role,muscles(slug))").eq("id", id).maybeSingle();
  if (!data) return null;
  const tr = data.exercise_translations.find(x => x.lang === lang) || data.exercise_translations.find(x => x.lang === "en") || data.exercise_translations[0] || {};
  return {id:data.id, level:data.level, eq:data.equipment, name:tr.name || "?", desc:tr.description || "", ms:data.exercise_muscles.map(x => ({slug:x.muscles.slug, role:x.role}))};
}

// ---------- Vues ----------
async function showMuscle(slug) {
  const m = muscles.find(x => x.slug === slug); if (!m) return;
  $("#mt").textContent = mn(m);
  document.querySelectorAll(".z").forEach(z => z.classList.toggle("sel", z.dataset.z === m.zone));
  const rows = (await listEx(slug)).concat(localRows(slug)).filter(r => !eqSel.size || (r.eq || []).some(x => eqSel.has(x)));
  $("#mlist").innerHTML = rows.length ? rows.map(r =>
    `<a class="row" href="#/exo/${esc(r.id)}"><span class="rn">${esc(r.name)}<small>${t(r.role === "primary" ? "prim" : "sec")}</small></span>` +
    `<span class="tags"><i class="tag lv">${t(r.level)}</i>${r.mine ? `<i class="tag c">${t("mine")}</i>` : ""}${eqs(r.eq).map(x => `<i class="tag">${x}</i>`).join("")}</span>` +
    `<span class="mut">${r.n} ${t("vids")}</span></a>`).join("") : `<p class="mut">${t("none")}</p>`;
}
async function showExo(id) {
  if (!/^u?\d+$/.test(id)) return;
  const e = await getExo(id);
  if (!e) { $("#et").textContent = "404"; return; }
  cur = e;
  $("#et").textContent = e.name;
  $("#emeta").innerHTML = `<i class="tag lv">${t(e.level)}</i>` + (e.mine ? `<i class="tag c">${t("mine")}</i>` : "") + eqs(e.eq).map(x => `<i class="tag">${x}</i>`).join("");
  $("#ed").textContent = e.desc;
  $("#chips").innerHTML = e.ms.map(x => { const m = muscles.find(y => y.slug === x.slug); return m ? `<a class="chip ${x.role}" href="#/muscle/${esc(m.slug)}" title="${t(x.role === "primary" ? "prim" : "sec")}">${esc(mn(m))}</a>` : ""; }).join("");
  loadVideos();
}
function vcard(v) {
  const id = /^[\w-]{11}$/.test(v.external_id || "") ? v.external_id : null;
  if (!id) return "";
  const tags = (v.is_reference ? `<i class="tag c">★ ${t("ref")}</i>` : "") + (v.coach_validated ? `<i class="tag c">✓ ${t("coach")}</i>` : "") + (v.status !== "published" ? `<i class="tag w">${t("pend")}</i>` : "");
  return `<div class="vid"><button class="th" data-id="${id}" style="background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)" aria-label="${t("video")}"><span>▶</span></button>` +
    `<div class="vm"><b>${esc(v.title || t("video"))}</b><div class="tags">${tags}</div>` +
    (v.loc ? `<div class="act"><button class="rp" data-rl="${id}">⚑ ${t("rep")}</button></div>` : `<div class="act"><button data-v="${v.id}" data-val="1" aria-label="+1">▲</button><b>${v.score}</b><button data-v="${v.id}" data-val="-1" aria-label="-1">▼</button><button class="rp" data-r="${v.id}">⚑ ${t("rep")}</button></div>`) + "</div></div>";
}
async function loadVideos() {
  const box = $("#vids");
  if (!sb || String(cur.id)[0] === "u") {
    const ids = [...(cur.v || []), ...(S.vid[cur.id] || [])].filter(x => !S.hid.includes(x));
    box.innerHTML = ids.length ? ids.map((x, i) => vcard({id:i, external_id:x, loc:1, status:"published"})).join("") : `<p class="mut">${t("noV")}</p>`;
    return;
  }
  const { data, error } = await sb.from("videos").select("id,external_id,title,score,status,is_reference,coach_validated")
    .eq("exercise_id", cur.id).order("is_reference", {ascending:false}).order("coach_validated", {ascending:false}).order("score", {ascending:false});
  if (error) return toast(error.message);
  box.innerHTML = data.length ? data.map(vcard).join("") : `<p class="mut">${t("noV")}</p>`;
}
function route() {
  const [, k, v] = location.hash.match(/^#\/(\w+)(?:\/(.+))?$/) || [];
  $("#home").hidden = !!k; $("#muscle").hidden = k !== "muscle"; $("#exo").hidden = k !== "exo";
  ["about", "faq", "calc", "timer", "log"].forEach(x => $("#" + x).hidden = k !== x);
  const kk = ["muscle", "exo"].includes(k) ? "" : (k || "");
  document.querySelectorAll(".tools a").forEach(a => a.toggleAttribute("aria-current", a.getAttribute("href") === "#/" + kk));
  if (k === "muscle") showMuscle(v); else if (k === "exo") showExo(v);
  else if (k === "timer") { if (!TM.h) tmReset(); }
  else if (k === "log") initLog();
  window.scrollTo(0, 0);
}

  const q = norm($("#q").value.trim());

  $("#sug").innerHTML = r.map(m => `<button data-s="${esc(m.slug)}">${esc(mn(m))}</button>`).join("");
});

$("#sug").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.s); });

// ---------- Vidéos : lecture, votes, signalements, ajout ----------
$("#vids").addEventListener("click", async e => {
  const th = e.target.closest(".th");
  if (th) { th.outerHTML = `<iframe class="th" src="https://www.youtube-nocookie.com/embed/${th.dataset.id}?autoplay=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`; return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.rl) return openReport({loc:1, id:b.dataset.rl});
  if (!sb) return toast(t("demo"));
  if (!user) return openAuth();
  if (b.dataset.v) {
    const { error } = await sb.from("votes").upsert({user_id:user.id, video_id:+b.dataset.v, value:+b.dataset.val}, {onConflict:"user_id,video_id"});
    if (error) toast(error.message); else loadVideos();
  } else if (b.dataset.r) {
    openReport({id:+b.dataset.r});
  }
});
$("#addf").onsubmit = async e => {
  e.preventDefault();
  const id = ytId($("#vurl").value);
  if (!id) return toast(t("badurl"));
  if (!sb || String(cur.id)[0] === "u") {
    const a = S.vid[cur.id] = S.vid[cur.id] || [];
    if (a.includes(id)) return toast(t("dup"));
    a.push(id); save(); $("#vurl").value = ""; toast(t("okpub")); return loadVideos();
  }
  if (!user) return openAuth();
  let title = null;
  try { const r = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id)); if (r.ok) title = (await r.json()).title; } catch {}
  const { data, error } = await sb.from("videos").insert({exercise_id:cur.id, user_id:user.id, source:"youtube", external_id:id, title, thumbnail_url:"https://i.ytimg.com/vi/" + id + "/hqdefault.jpg", language:lang, level:cur.level}).select("status").single();
  if (error) return toast(error.code === "23505" ? t("dup") : error.message);
  $("#vurl").value = ""; toast(t(data.status === "published" ? "okpub" : "okpend")); loadVideos();
};

// ---------- Compte ----------
function openAuth() { if (!sb) return toast(t("demo")); $("#auth").showModal(); }
async function auth(kind) {
  const email = $("#mail").value, password = $("#pw").value;
  const { data, error } = kind === "up" ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
  if (error) return toast(error.message);
  $("#auth").close(); toast(kind === "up" && !data.session ? t("confirm") : t("hi"));
}
$("#af").onsubmit = e => { e.preventDefault(); auth("in"); };
$("#bup").onclick = () => $("#af").reportValidity() && auth("up");
$("#bx").onclick = () => $("#auth").close();
$("#ab").onclick = () => user ? sb.auth.signOut() : openAuth();

// ---------- Langue, niveau, démarrage ----------
$("#lg").onchange = e => { lang = e.target.value; localStorage.lang = lang; applyI18n(); renderEq(); route(); };
$("#lv").onchange = e => { level = e.target.value; localStorage.level = level; route(); };
addEventListener("hashchange", route);

function renderEq() {
  const mk = (box, set, cb) => {
    box.innerHTML = Object.keys(EQ).map(k => `<button type="button" data-k="${k}" aria-pressed="${set.has(k)}">${EQ[k][lang === "fr" ? 0 : 1]}</button>`).join("");
    box.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k; set.has(k) ? set.delete(k) : set.add(k); b.setAttribute("aria-pressed", set.has(k)); if (cb) cb(); };
  };
  mk($("#eqf"), eqSel, () => showMuscle(curSlug()));
  mk($("#xeq"), xSel);
}
$("#addx").onsubmit = e => {
  e.preventDefault();
  const slug = curSlug(); if (!slug) return;
  const ex = {id:"u" + Date.now(), level:$("#xl").value, eq:[...xSel], n:$("#xn").value.trim(), d:$("#xd").value.trim(), m:{[slug]:"primary"}};
  S.ex.push(ex);
  const v = ytId($("#xv").value); if (v) S.vid[ex.id] = [v];
  save(); e.target.reset(); xSel.clear(); renderEq(); showMuscle(slug); toast(t("xok"));
};
const paint = () => $("#th").textContent = theme === "dark" ? "☀" : "☾";
$("#th").onclick = () => { theme = theme === "dark" ? "light" : "dark"; localStorage.theme = theme; document.documentElement.dataset.theme = theme; paint(); };
paint();

// ----- Signalement -----
let RP = null;
function openReport(o) { RP = o; $("#rdlg").showModal(); }
$("#rx").onclick = () => $("#rdlg").close();
$("#rf").onsubmit = async e => {
  e.preventDefault();
  const reason = $("#rr").value, details = $("#rd").value.trim() || null;
  $("#rdlg").close(); $("#rd").value = "";
  if (RP.loc) { S.hid.push(RP.id); save(); toast(t("reportedL")); return loadVideos(); }

  toast(error ? (error.code === "23505" ? t("repdup") : error.message) : t("reported"));
};

// ----- Calories et macros -----
$("#cf").onsubmit = e => {
  e.preventDefault();
  const man = $("#cs").value === "m", a = +$("#ca").value, h = +$("#ch").value, w = +$("#cw").value, g = $("#cg").value;
  if (a < 18 && g === "cut") { $("#cres").innerHTML = `<p>${t("minor")}</p>`; return; }
  const bmr = 10 * w + 6.25 * h - 5 * a + (man ? 5 : -161);
  const kcal = Math.round(Math.max(bmr * +$("#cac").value * ({bulk:1.1, cut:.85, maint:1})[g], man ? 1500 : 1200));
  const p = Math.round(w * (g === "cut" ? 2.2 : 1.8)), f = Math.round(kcal * .25 / 9), c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  $("#cres").innerHTML = `<div class="macros"><div><b>${kcal}</b><span>kcal</span></div><div><b>${p} g</b><span>${t("prot")}</span></div><div><b>${c} g</b><span>${t("carb")}</span></div><div><b>${f} g</b><span>${t("fat")}</span></div></div>`;
};

// ----- Minuteur HIIT / Tabata -----
const TM = {h:null, q:[], i:0, end:0, left:0, last:0};
const beep = (f = 880, d = .12) => { try { const c = beep.c = beep.c || new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; g.gain.value = .15; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + d); } catch {} };
function tmBuild() {
  const w = +$("#tw").value || 20, r = +$("#tr").value || 0, n = +$("#tn").value || 1;
  TM.q = [{k:"prep", d:5, n:0}];
  for (let j = 1; j <= n; j++) { TM.q.push({k:"work", d:w, n:j}); if (r && j < n) TM.q.push({k:"rest", d:r, n:j}); }
  TM.q.push({k:"done", d:0, n:0});
}
function tmShow() {
  const p = TM.q[TM.i];
  $("#tt").textContent = p.k === "done" ? "✓" : Math.ceil(TM.left / 1000);
  $("#tp").textContent = t("ph_" + p.k) + (p.n ? " " + p.n + "/" + (+$("#tn").value || 1) : "");
  $("#tm").dataset.k = p.k;
}
function tmStop() { clearInterval(TM.h); TM.h = null; $("#tgo").textContent = t("tstart"); }
function tmReset() { tmStop(); tmBuild(); TM.i = 0; TM.left = TM.q[0].d * 1000; tmShow(); }
function tmTick() {
  TM.left = TM.end - Date.now();
  if (TM.left <= 0) {
    const p = TM.q[++TM.i];
    if (p.k === "done") { tmStop(); TM.left = 0; beep(520, .6); return tmShow(); }
    TM.left = p.d * 1000; TM.end = Date.now() + TM.left; TM.last = 0; beep(p.k === "work" ? 988 : 660, .3);
  } else { const s = Math.ceil(TM.left / 1000); if (s <= 3 && s !== TM.last) { TM.last = s; beep(660, .08); } }
  tmShow();
}
$("#tgo").onclick = () => {
  if (TM.h) { TM.left = TM.end - Date.now(); return tmStop(); }
  if (!TM.q.length || TM.q[TM.i].k === "done") tmReset();
  TM.end = Date.now() + TM.left; TM.h = setInterval(tmTick, 200); $("#tgo").textContent = t("tpause"); beep(660, .1); tmShow();
};
$("#trs").onclick = tmReset;
$("#tpre").onclick = e => { const b = e.target.closest("button"); if (!b) return; $("#tw").value = b.dataset.w; $("#tr").value = b.dataset.r; $("#tn").value = b.dataset.n; tmReset(); };
["#tw", "#tr", "#tn"].forEach(q => $(q).addEventListener("input", () => { if (!TM.h) tmReset(); }));

// ----- Carnet de bord (enregistré sur l’appareil) -----
function initLog() { if (!$("#ld").value) $("#ld").value = new Date().toLocaleDateString("sv"); renderLog(); }
function renderLog() {
  const L = S.log, names = [...new Set(L.map(x => x.e))], sel = $("#ls"), keep = sel.value;
  $("#ln").innerHTML = names.map(n => `<option value="${esc(n)}">`).join("");
  sel.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join(""); if (names.includes(keep)) sel.value = keep;
  $("#lt").innerHTML = [...L].sort((a, b) => b.d.localeCompare(a.d) || b.id - a.id).map(x =>
    `<tr><td>${esc(x.d)}</td><td>${esc(x.e)}</td><td>${x.s} × ${x.r}${x.w ? " @ " + x.w + " kg" : ""}</td><td><button data-del="${x.id}" aria-label="${t("del")}">×</button></td></tr>`).join("") || `<tr><td class="mut">${t("lempty")}</td></tr>`;
  drawLog();
}
function drawLog() {
  const n = $("#ls").value, pts = S.log.filter(x => x.e === n), byW = pts.some(x => x.w > 0), m = new Map();
  pts.forEach(x => m.set(x.d, Math.max(m.get(x.d) || 0, byW ? x.w : x.r)));
  const d = [...m].sort((a, b) => a[0].localeCompare(b[0]));
  if (d.length < 2) { $("#lc").innerHTML = `<p class="mut">${t("lneed")}</p>`; return; }
  const vs = d.map(x => x[1]), lo = Math.min(...vs), hi = Math.max(...vs);
  const px = i => 30 + i * 540 / (d.length - 1), py = v => 150 - (hi === lo ? 60 : (v - lo) / (hi - lo) * 120);
  $("#lc").innerHTML = `<svg viewBox="0 0 600 190" role="img" aria-label="${esc(n)}"><polyline fill="none" stroke="var(--acc)" stroke-width="3" points="${d.map((x, i) => px(i) + "," + py(x[1])).join(" ")}"/>` +
    d.map((x, i) => `<circle cx="${px(i)}" cy="${py(x[1])}" r="4" fill="var(--acc)"><title>${esc(x[0])} : ${x[1]}</title></circle>`).join("") +
    `<text x="30" y="16" font-size="14" fill="var(--mut)">${byW ? "kg" : "reps"} : ${lo} → ${hi}</text><text x="30" y="182" font-size="14" fill="var(--mut)">${esc(d[0][0])}</text><text x="570" y="182" font-size="14" text-anchor="end" fill="var(--mut)">${esc(d[d.length - 1][0])}</text></svg>`;
}
$("#lf").onsubmit = e => {
  e.preventDefault();
  S.log.push({id:Date.now(), d:$("#ld").value, e:$("#le").value.trim(), s:+$("#lsr").value, r:+$("#lr").value, w:+$("#lw").value || 0});
  save(); $("#le").value = ""; renderLog(); toast(t("lok"));
};
$("#lt").onclick = e => { const b = e.target.closest("[data-del]"); if (!b) return; S.log = S.log.filter(x => x.id != b.dataset.del); save(); renderLog(); };
$("#ls").onchange = drawLog;

(async () => {
  $("#lg").value = lang; $("#lv").value = level;
  muscles = sb ? await dbMuscles() : DM;
  if (sb) {
    const { data } = await sb.auth.getSession(); user = data.session ? data.session.user : null;
    sb.auth.onAuthStateChange((_, s) => { user = s ? s.user : null; applyI18n(); });
  }
  document.querySelectorAll(".z").forEach(z => { z.tabIndex = 0; z.setAttribute("role", "button"); });
  applyI18n(); renderEq(); route();
})();
</script>
